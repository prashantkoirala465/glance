[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glance"
version = "0.1.0"
description = "Point it at a messy CSV. Get a cleaned dataset, a profile, charts, and a plain-English summary."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
narrate = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
glance = "glance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/glance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
